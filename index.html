<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Task Tracker</h1>
            <p>Gerenciador de Tarefas e Hábitos</p>
        </header>

        <section class="stats-card">
            <div class="stat-item">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Concluídas</span>
                <span class="stat-value" id="stat-completed">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Progresso</span>
                <span class="stat-value" id="stat-progress">0%</span>
            </div>
        </section>

        <form id="task-form" class="task-form">
            <input type="text" id="task-input" placeholder="O que você precisa fazer?" required autocomplete="off">
            <select id="category-select">
                <option value="Geral">Geral</option>
                <option value="Estudos">Estudos</option>
                <option value="Trabalho">Trabalho</option>
                <option value="Pessoal">Pessoal</option>
            </select>
            <button type="submit" class="btn-primary">Adicionar</button>
        </form>

        <nav id="filter-container" class="filter-group">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </nav>

        <ul id="task-list" class="task-list"></ul>

        <script src="app.js"></script>

    </main>
</body>
</html>
